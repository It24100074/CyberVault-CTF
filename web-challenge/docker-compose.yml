services: 
  web: 
    build: ./web 
    ports: ["8080:80"] 
    depends_on: [db] 
    networks: [ctf] 
  db: 
    image: mariadb:10 
    environment: 
      MYSQL_ROOT_PASSWORD: rootpass 
      MYSQL_DATABASE: cybervault 
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql 
    networks: [ctf] 
networks: 
  ctf: 
    driver: bridge